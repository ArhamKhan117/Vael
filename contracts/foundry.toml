[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Creditcoin has no cancun opcodes: no transient storage, no mcopy.
evm_version = "shanghai"
# block.prevrandao is 0 on Creditcoin, so Foundry's prevrandao check is bypassed.
bypass_prevrandao = true
via_ir = true
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "@gluwa/=node_modules/@gluwa/"
]

# Read-only access to the captured real-network fixtures the adapter tests replay.
fs_permissions = [{ access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
creditcoin = "${CREDITCOIN_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
